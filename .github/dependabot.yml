version: 2
updates:
  # Keeps the SHA-pinned actions current; the trailing comment names the tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Crates are exact-pinned (`=x.y.z`); updates arrive as reviewable PRs.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
