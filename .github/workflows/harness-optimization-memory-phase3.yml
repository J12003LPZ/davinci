name: Harness optimization memory phase three

on:
  push:
    branches:
      - feat/davinci-harness-optimization-20260914

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[opt-memory3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Add phase three regressions
        run: python3 .github/scripts/harness_opt_memory_phase3.py tests

      - name: Verify phase three regressions are red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p davinci-evals retrieval_metrics_expose_irrelevant_tokens_and_missed_evidence; then
            echo "T13 retrieval-eval regression unexpectedly passed before implementation" >&2
            exit 1
          fi
          echo "Expected red regression confirmed: T13 labeled retrieval evaluation"
          if cargo test -p davinci-coding-agent phase3_candidate_limit_is_a_hard_search_ceiling; then
            echo "T14 candidate-limit regression unexpectedly passed before implementation" >&2
            exit 1
          fi
          echo "Expected red regression confirmed: T14 bounded hybrid retrieval"

      - name: Apply phase three implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/harness_opt_memory_phase3.py impl
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/davinci-coding-agent/src/native_extensions/vector_memory.rs')
          text = path.read_text()
          old = "token.contains(['-', '_', ':', '/', '.'])"
          new = "token.chars().any(|ch| matches!(ch, '-' | '_' | ':' | '/' | '.'))"
          if old not in text:
              raise SystemExit('expected identifier helper syntax anchor')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Verify T13 labeled retrieval evaluation
        shell: bash
        run: |
          cargo test -p davinci-evals 'harness_eval::tests::'

      - name: Verify T14 and bounded indexing regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p davinci-coding-agent phase3_candidate_limit_is_a_hard_search_ceiling
          cargo test -p davinci-coding-agent phase3_oversized_first_hit_does_not_starve_smaller_evidence
          cargo test -p davinci-coding-agent phase3_bounded_indexing_makes_incremental_progress
          cargo test -p davinci-coding-agent phase3_exact_identifier_survives_small_candidate_budget

      - name: Verify memory and eval suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p davinci-coding-agent vector_memory
          cargo test -p davinci-evals --lib
          cargo clippy -p davinci-coding-agent -p davinci-evals --all-targets -- -D warnings
          git diff --check

      - name: Commit verified production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/davinci-coding-agent/src/native_extensions/vector_memory.rs \
                  crates/davinci-evals/src/lib.rs \
                  crates/davinci-evals/src/harness_eval.rs
          if git diff --cached --quiet; then
            echo "No production changes"
            exit 0
          fi
          git commit -m "feat(memory): bound retrieval candidates and indexing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
