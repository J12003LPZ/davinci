name: PR44 branch normalization

on:
  push:
    branches:
      - fix/pr44-regressions-20260925

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr44-regressions-20260925
          fetch-depth: 0
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Normalize Rust and lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          find scripts/ui -type f -path '*/__pycache__/*.pyc' -delete 2>/dev/null || true
          git add -A
      - name: Commit generated repairs
        run: |
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: normalize formatting and lockfile"
          git push origin HEAD:fix/pr44-regressions-20260925
