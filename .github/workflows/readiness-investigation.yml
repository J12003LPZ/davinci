name: Readiness investigation

on:
  push:
    branches: [codex/2026-09-30-production-harness-readiness]
    paths: [.github/workflows/readiness-investigation.yml]

permissions:
  contents: read

jobs:
  windows-parallel:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PI_OFFLINE: '1'
      DAVINCI_OFFLINE: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Build with repository-pinned Rust
        shell: pwsh
        run: |
          rustup show
          node --version
          cargo build -p davinci-coding-agent --bin davinci --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p davinci-coding-agent --lib --locked --no-run
          exit $LASTEXITCODE
      - name: Sample two full parallel library runs
        shell: pwsh
        run: |
          $samples = Join-Path $env:RUNNER_TEMP 'windows-process-samples.jsonl'
          $monitor = Start-Job -ArgumentList $samples -ScriptBlock {
            param($path)
            while ($true) {
              $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue)
              $cpu = Get-CimInstance Win32_PerfFormattedData_PerfOS_Processor -Filter "Name='_Total'" -ErrorAction SilentlyContinue
              foreach ($node in $nodes) {
                if ($node.CommandLine -notmatch 'relative.cjs') { continue }
                $process = Get-Process -Id $node.ProcessId -ErrorAction SilentlyContinue
                $row = [ordered]@{
                  at = [DateTime]::UtcNow.ToString('o')
                  pid = $node.ProcessId
                  parent = $node.ParentProcessId
                  command = $node.CommandLine
                  user_time = $node.UserModeTime
                  kernel_time = $node.KernelModeTime
                  node_count = $nodes.Count
                  total_cpu = $cpu.PercentProcessorTime
                  threads = @($process.Threads | Select-Object Id,ThreadState,WaitReason)
                }
                $row | ConvertTo-Json -Depth 5 -Compress | Add-Content -Path $path
              }
              Start-Sleep -Seconds 1
            }
          }
          $failed = $false
          try {
            foreach ($attempt in 1,2) {
              cargo test -p davinci-coding-agent --lib --locked 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "windows-library-$attempt.log")
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          } finally {
            Stop-Job $monitor
            Receive-Job $monitor
            Remove-Job $monitor
            if (Test-Path $samples) { Get-Content $samples }
          }
          if ($failed) { exit 1 }
      - name: Preserve investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-windows-parallel
          path: |
            ${{ runner.temp }}/windows-library-*.log
            ${{ runner.temp }}/windows-process-samples.jsonl
          retention-days: 3
          if-no-files-found: warn

  offline-build-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect tracked source and pinned offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          # Download only; compilation remains on the repository's Rust 1.83.
          # Inactive optional dependencies may use newer manifest syntax.
          cargo +stable fetch --locked --target x86_64-unknown-linux-gnu
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/davinci-source.tar.gz"
          toolchain="$(dirname "$(dirname "$(rustup which rustc)")")"
          tar -czf "$RUNNER_TEMP/davinci-rust-1.83.tar.gz" --exclude='./share/doc' -C "$toolchain" .
          tar -czf "$RUNNER_TEMP/davinci-cargo-cache.tar.gz" -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@v4
        with:
          name: readiness-offline-build-inputs
          path: |
            ${{ runner.temp }}/davinci-source.tar.gz
            ${{ runner.temp }}/davinci-rust-1.83.tar.gz
            ${{ runner.temp }}/davinci-cargo-cache.tar.gz
          retention-days: 1
          if-no-files-found: error
