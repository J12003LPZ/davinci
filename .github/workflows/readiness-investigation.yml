name: Readiness investigation

on:
  push:
    branches: [codex/2026-09-30-production-harness-readiness]
    paths: [.github/workflows/readiness-investigation.yml]

permissions:
  contents: read

jobs:
  windows-spawn:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned tools
        shell: pwsh
        run: |
          rustup show
          node --version
          Get-Command node | Format-List Source,Version
      - name: Compare Windows launch spellings and stdin
        shell: pwsh
        run: |
          @'
          use std::{env, fs, path::{Path, PathBuf}, process::{Command, Stdio}, thread, time::{Duration, Instant}};
          use std::os::windows::process::CommandExt;
          fn ordinary(p: &Path) -> PathBuf {
              let s = p.to_string_lossy();
              if let Some(rest) = s.strip_prefix(r"\\?\UNC\") { return PathBuf::from(format!(r"\\{}", rest)); }
              PathBuf::from(s.strip_prefix(r"\\?\").unwrap_or(&s))
          }
          fn main() {
              let root = env::temp_dir().join(format!("davinci-spawn-diagnostic-{}", std::process::id()));
              fs::create_dir_all(&root).unwrap();
              fs::write(root.join("relative.cjs"), "console.error('SCRIPT_ENTERED');require('fs').writeFileSync('relative-script.ok','OK');console.log(process.cwd())").unwrap();
              let node = PathBuf::from(env::args_os().nth(1).unwrap()).canonicalize().unwrap();
              let cwd = root.canonicalize().unwrap();
              for (name, exe, dir, piped) in [
                  ("canonical-exe/ordinary-cwd/piped", node.clone(), ordinary(&cwd), true),
                  ("ordinary-exe/ordinary-cwd/piped", ordinary(&node), ordinary(&cwd), true),
                  ("canonical-exe/canonical-cwd/piped", node.clone(), cwd.clone(), true),
                  ("canonical-exe/ordinary-cwd/null", node.clone(), ordinary(&cwd), false),
              ] {
                  let _ = fs::remove_file(root.join("relative-script.ok"));
                  let mut cmd = Command::new(&exe);
                  cmd.arg("relative.cjs").current_dir(&dir).env_clear().creation_flags(0x08000000)
                     .stdout(Stdio::inherit()).stderr(Stdio::inherit());
                  for key in ["PATH", "SystemRoot", "TEMP", "TMP", "WINDIR"] {
                      if let Some(value) = env::var_os(key) { cmd.env(key, value); }
                  }
                  cmd.stdin(if piped { Stdio::piped() } else { Stdio::null() });
                  println!("CASE={name} exe={exe:?} cwd={dir:?}");
                  let start = Instant::now();
                  let mut child = cmd.spawn().unwrap();
                  println!("PID={}", child.id());
                  loop {
                      if let Some(status) = child.try_wait().unwrap() {
                          println!("EXIT={status} elapsed={:?} marker={}", start.elapsed(), root.join("relative-script.ok").is_file());
                          break;
                      }
                      if start.elapsed() > Duration::from_secs(15) {
                          println!("TIMEOUT marker={}", root.join("relative-script.ok").is_file());
                          child.kill().unwrap(); child.wait().unwrap(); break;
                      }
                      thread::sleep(Duration::from_millis(25));
                  }
              }
              fs::remove_dir_all(root).unwrap();
          }
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\spawn.rs"
          rustc --edition 2021 "$env:RUNNER_TEMP\spawn.rs" -o "$env:RUNNER_TEMP\spawn.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\spawn.exe" (Get-Command node).Source
          exit $LASTEXITCODE

  offline-build-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect tracked source and pinned offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          cargo fetch --locked
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/davinci-source.tar.gz"
          toolchain="$(dirname "$(dirname "$(rustup which rustc)")")"
          tar -czf "$RUNNER_TEMP/davinci-rust-1.83.tar.gz" --exclude=share/doc -C "$toolchain" bin lib libexec etc share
          tar -czf "$RUNNER_TEMP/davinci-cargo-cache.tar.gz" -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@v4
        with:
          name: readiness-offline-build-inputs
          path: |
            ${{ runner.temp }}/davinci-source.tar.gz
            ${{ runner.temp }}/davinci-rust-1.83.tar.gz
            ${{ runner.temp }}/davinci-cargo-cache.tar.gz
          retention-days: 1
          if-no-files-found: error
