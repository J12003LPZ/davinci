name: Isolated PR review repair

on:
  push:
    branches: [fix/pr-integration-review-20261003]
    paths:
      - .github/workflows/pr-review-repair.yml
      - .github/scripts/pr_review_repair.py
      - .github/scripts/pr-review-patches.json.gz

permissions:
  contents: write

concurrency:
  group: pr-review-repair-20261003
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PI_OFFLINE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Add regression tests to the integrated source
        run: python3 .github/scripts/pr_review_repair.py red
      - name: Demonstrate the regressions before fixes
        run: python3 .github/scripts/pr_review_repair.py test-red
      - name: Apply and format the fixes
        run: python3 .github/scripts/pr_review_repair.py green
      - name: Verify fixed regression cases
        run: python3 .github/scripts/pr_review_repair.py test-green
      - name: Verify adjacent offline execution contracts
        run: python3 .github/scripts/pr_review_repair.py test-contracts
      - name: Check affected production code
        run: python3 .github/scripts/pr_review_repair.py clippy
      - name: Publish verified fixes only to the isolated branch
        run: python3 .github/scripts/pr_review_repair.py publish
      - name: Collect source and verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/scripts/pr_review_repair.py; then
            python3 .github/scripts/pr_review_repair.py collect
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-review-repair-verification
          path: ${{ runner.temp }}/pr-review-verification
          retention-days: 7
          if-no-files-found: error
