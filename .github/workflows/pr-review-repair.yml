name: Isolated PR review repair

on:
  push:
    branches: [fix/pr-integration-review-20261003]
    paths:
      - .github/workflows/pr-review-repair.yml
      - .github/scripts/pr_review_repair.py

permissions:
  contents: write

concurrency:
  group: pr-review-repair-20261003
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate reviewed PR heads on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/pr-integration-review-20261003'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin e07702a02892d4d8b30ec2a76b16820897bfa3f5 a7a59af4cc2781296c1f69f7dc214da784790bce
          git merge-base --is-ancestor 06bc2f8aa93fee58568cd37fe68ef5a6d24810e3 HEAD
          git merge --no-edit --no-ff e07702a02892d4d8b30ec2a76b16820897bfa3f5
          git merge --no-edit --no-ff a7a59af4cc2781296c1f69f7dc214da784790bce
          git diff --check a669549c5356af8110feff589bc15864fce7209b HEAD
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Export tracked source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/review-source/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/review-source/revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-review-integrated-source
          path: ${{ runner.temp }}/review-source
          retention-days: 3
          if-no-files-found: error
