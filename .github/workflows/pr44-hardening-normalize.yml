name: PR44 hardening normalize

on:
  push:
    branches:
      - codex/2026-09-24-pr44-hardening

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/2026-09-24-pr44-hardening
          fetch-depth: 0
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Normalize Rust source and remove bytecode artifacts
        shell: bash
        run: |
          cargo fmt --all
          find scripts/ui -type f -path '*/__pycache__/*.pyc' -delete 2>/dev/null || true
          git add -A -- '*.rs' 'scripts/ui/__pycache__/*.pyc' || true
      - name: Commit generated normalization
        shell: bash
        run: |
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: normalize Rust formatting"
          git push origin HEAD:codex/2026-09-24-pr44-hardening
