name: Harness optimization T15 backlog inspection

on:
  push:
    branches:
      - feat/davinci-harness-optimization-20260914

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[opt-t15-backlog]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact T15 backlog
        shell: bash
        run: |
          set -euo pipefail
          plan='docs/superpowers/plans/2026-09-06-harness-capability-token-efficiency.md'
          line=$(grep -n -m1 '^### T15 ' "$plan" | cut -d: -f1)
          end=$(( line + 28 ))
          sed -n "${line},${end}p" "$plan"
      - name: Show embedding function bodies
        shell: bash
        run: |
          set -euo pipefail
          file='crates/davinci-coding-agent/src/native_extensions/vector_memory.rs'
          sed -n '930,1030p' "$file"
          sed -n '1440,1705p' "$file"
