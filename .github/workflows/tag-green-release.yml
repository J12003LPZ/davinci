name: Tag green release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA with completed green CI
        required: true
      version:
        description: Product version from Cargo.toml (initial release 1.0.71)
        required: true
        default: '1.1.0'

permissions:
  contents: write
  actions: read

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact source, full CI, and version before creating tag
        run: |
          set -euo pipefail
          python scripts/release_identity.py preflight --repo "$PWD" --output "$RUNNER_TEMP/release-proof.json"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          proof = json.loads(Path(os.environ['RUNNER_TEMP'], 'release-proof.json').read_text())
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['RELEASE_COMMIT'])
          assert proof['source']['source_sha'] == os.environ['RELEASE_COMMIT']
          assert proof['version'] == os.environ['RELEASE_VERSION']
          PY
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$RELEASE_COMMIT"
            echo "Version tag already identifies this verified commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$RELEASE_COMMIT" -m "DaVinci $RELEASE_VERSION; green full CI verified"
            git push origin "refs/tags/$tag"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ci-proof
          path: ${{ runner.temp }}/release-proof.json
          if-no-files-found: error
