name: Terminal implementation

on:
  push:
    branches: [J12003LPZ/claude-terminal-implementation-20260921]
    paths:
      - 'crates/davinci-tui/**'
      - 'crates/davinci-coding-agent/**'
      - '.github/workflows/terminal-implementation.yml'
      - '.github/terminal-ui/**'

permissions:
  contents: read

concurrency:
  group: terminal-implementation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  PI_OFFLINE: '1'

jobs:
  workbench:
    if: contains(github.event.head_commit.message, '[workbench]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
      - name: Collect pinned offline build inputs
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/terminal-workbench"
          mkdir -p "$kit"
          cargo check --locked -p davinci-tui
          cp -a "$CARGO_HOME/registry" "$kit/registry"
          cp -a "$(rustc --print sysroot)" "$kit/toolchain"
          rustc --version --verbose > "$kit/provenance.txt"
          git rev-parse HEAD >> "$kit/provenance.txt"
          tar -C "$kit" -czf "$RUNNER_TEMP/terminal-workbench.tar.gz" toolchain registry provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-workbench-${{ github.sha }}
          path: ${{ runner.temp }}/terminal-workbench.tar.gz
          retention-days: 1
          if-no-files-found: error
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: terminal-implementation
      - name: Apply candidate to isolated checkout
        if: hashFiles('.github/terminal-ui/candidate.patch') != ''
        run: python .github/terminal-ui/assemble.py apply
      - name: Format candidate source
        if: hashFiles('.github/terminal-ui/candidate.patch') != ''
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          paths = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'terminal-paths.json').read_text())
          for path in paths:
              if path.endswith('.rs'):
                  subprocess.run(['rustfmt', '--edition', '2021', path], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Rebuild contracts
        run: cargo test --locked -p davinci-tui --test terminal_rebuild -- --nocapture
      - name: Entire TUI suite
        if: always()
        run: cargo test --locked -p davinci-tui
      - name: TUI lint
        if: always()
        run: cargo clippy --locked -p davinci-tui --all-targets -- -D warnings
      - name: Publish tested tree without updating any branch
        if: success() && hashFiles('.github/terminal-ui/candidate.patch') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/terminal-ui/assemble.py publish
      - name: Save candidate tree identity
        if: success() && hashFiles('.github/terminal-ui/candidate.patch') != ''
        uses: actions/upload-artifact@v4
        with:
          name: terminal-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/terminal-candidate.json
          retention-days: 3
          if-no-files-found: error
