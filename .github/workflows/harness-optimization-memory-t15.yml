name: Harness optimization memory T15

on:
  push:
    branches:
      - feat/davinci-harness-optimization-20260914

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[opt-t15]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Add T15 regressions
        run: python3 .github/scripts/harness_opt_memory_t15.py tests

      - name: Verify T15 regression is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p davinci-coding-agent phase3_t15_projection_profile_is_explicit_local; then
            echo "T15 projection regression unexpectedly passed before implementation" >&2
            exit 1
          fi
          echo "Expected red regression confirmed: T15 projection profile and compatibility identity"

      - name: Apply T15 implementation
        run: python3 .github/scripts/harness_opt_memory_t15.py impl

      - name: Align network regression with local projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/davinci-coding-agent/src/native_extensions/vector_memory.rs")
          text = path.read_text()

          old_name = "fn indexing_persists_remote_embeddings_and_searches_dense_hits() {"
          new_name = "fn indexing_persists_local_embeddings_and_searches_dense_hits() {"
          if text.count(old_name) != 1:
              raise SystemExit(f"expected one legacy network-test name, found {text.count(old_name)}")
          text = text.replace(old_name, new_name, 1)

          old_loop = "            for _ in 0..3 {\n"
          new_loop = (
              "            // Local projection performs two embedding-service requests here: "
              "document indexing and query embedding. Automatic Qdrant writes are disabled.\n"
              "            for _ in 0..2 {\n"
          )
          if text.count(old_loop) != 1:
              raise SystemExit(f"expected one three-request network loop, found {text.count(old_loop)}")
          text = text.replace(old_loop, new_loop, 1)
          path.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Verify T15 focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p davinci-coding-agent phase3_t15_projection_profile_is_explicit_local
          cargo test -p davinci-coding-agent phase3_t15_embedding_identity_changes_with_model_or_dimensions
          cargo test -p davinci-coding-agent phase3_t15_legacy_or_changed_embedding_is_incompatible

      - name: Verify vector memory suite
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          echo "Running T15 vector_memory regression suite"
          cargo test -p davinci-coding-agent vector_memory

      - name: Verify T15 clippy
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          echo "Running T15 package clippy gate"
          cargo clippy -p davinci-coding-agent --all-targets -- -D warnings

      - name: Verify generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: Commit verified T15 production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/davinci-coding-agent/src/native_extensions/vector_memory.rs \
                  crates/davinci-coding-agent/src/native_extensions/ecosystem/mod.rs \
                  docs/superpowers/plans/2026-09-15-memory-projection-decision.md
          if git diff --cached --quiet; then
            echo "No T15 production changes"
            exit 0
          fi
          git commit -m "feat(memory): choose local projection profile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
