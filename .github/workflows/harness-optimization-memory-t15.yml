name: Harness optimization memory T15

on:
  push:
    branches:
      - feat/davinci-harness-optimization-20260914

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[opt-t15]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Add T15 regressions
        run: python3 .github/scripts/harness_opt_memory_t15.py tests

      - name: Verify T15 regression is red
        shell: bash
        run: |
          set -euo pipefail
          if cargo test -p davinci-coding-agent phase3_t15_projection_profile_is_explicit_local; then
            echo "T15 projection regression unexpectedly passed before implementation" >&2
            exit 1
          fi
          echo "Expected red regression confirmed: T15 projection profile and compatibility identity"

      - name: Apply T15 implementation
        run: python3 .github/scripts/harness_opt_memory_t15.py impl

      - name: Format
        run: cargo fmt --all

      - name: Verify T15 focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p davinci-coding-agent phase3_t15_projection_profile_is_explicit_local
          cargo test -p davinci-coding-agent phase3_t15_embedding_identity_changes_with_model_or_dimensions
          cargo test -p davinci-coding-agent phase3_t15_legacy_or_changed_embedding_is_incompatible

      - name: Verify vector memory suite and clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p davinci-coding-agent vector_memory
          cargo clippy -p davinci-coding-agent --all-targets -- -D warnings
          git diff --check

      - name: Commit verified T15 production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/davinci-coding-agent/src/native_extensions/vector_memory.rs \
                  docs/superpowers/plans/2026-09-15-memory-projection-decision.md
          if git diff --cached --quiet; then
            echo "No T15 production changes"
            exit 0
          fi
          git commit -m "feat(memory): choose local projection profile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
