name: Prepare pinned PR review fixes

on:
  push:
    branches: [maintenance/review-fix-preparation-20261003]

permissions:
  contents: read

concurrency:
  group: review-fix-preparation-20261003
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and extract reviewed source transformations
        run: |
          echo '321840451bd69ee72a2fe6ca6a12897e29548796f9a5ef5338c65c29347fb712  review-preparation.zip' | sha256sum --check
          python3 -m zipfile -e review-preparation.zip "$RUNNER_TEMP/review-tools"
      - name: Prepare exact source trees and format touched Rust
        run: python3 "$RUNNER_TEMP/review-tools/prepare_review_fixes.py" prepare
      - name: Upload immutable Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/review-tools/prepare_review_fixes.py" upload
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-review-fix-trees
          path: |
            ${{ runner.temp }}/davinci-review-prepared/trees.json
            ${{ runner.temp }}/davinci-review-prepared/manifest.json
          if-no-files-found: error
  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PI_OFFLINE: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce the exact prepared source
        run: |
          echo '321840451bd69ee72a2fe6ca6a12897e29548796f9a5ef5338c65c29347fb712  review-preparation.zip' | sha256sum --check
          python3 -m zipfile -e review-preparation.zip "$RUNNER_TEMP/review-tools"
          python3 "$RUNNER_TEMP/review-tools/prepare_review_fixes.py" prepare
      - name: Subscription usage regressions
        working-directory: ${{ runner.temp }}/davinci-review-prepared/integration
        run: node --test scripts/tests/subscription-usage*.test.mjs
      - name: Fast capability and Design host regressions
        working-directory: ${{ runner.temp }}/davinci-review-prepared/integration
        run: |
          cargo test -p davinci-ai --locked --lib service_tier
          cargo test -p davinci-coding-agent --locked --lib fast::tests
          cargo test -p davinci-coding-agent --locked --lib service_tier_regression_tests
          cargo test -p davinci-coding-agent --locked --bin davinci review_regression_tests
