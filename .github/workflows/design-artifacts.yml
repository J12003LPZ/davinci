name: Design artifacts

on:
  pull_request:
    paths:
      - 'crates/davinci-agent/**'
      - 'crates/davinci-session/**'
      - 'crates/davinci-coding-agent/**'
      - 'crates/davinci-evals/**'
      - 'scripts/*design*'
      - 'docs/evals/design/**'
      - '.github/workflows/design-artifacts.yml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      native_render:
        description: 'Run the strict generated-content rendering gate on Linux (never a live model evaluation)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: design-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PI_OFFLINE: '1'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: rustup show
      - run: python scripts/design-contracts.py --check
      - name: Every design integration target and the offline evaluation manifest
        run: python scripts/test-design.py
      - name: Durable design publication interruption boundaries
        run: cargo test -p davinci-coding-agent --lib design::publication_tests --locked
      - name: Recovery after physical process termination
        run: cargo test -p davinci-coding-agent --lib design::termination_tests::physical_termination --locked
      - name: Private browser font cache cleanup
        run: cargo test -p davinci-coding-agent --lib private_font_cache_is_removed --locked
      - name: Install locked companion development tools
        run: npm --prefix crates/davinci-coding-agent/design-ui ci
      - run: npm --prefix crates/davinci-coding-agent/design-ui run typecheck
      - run: npm --prefix crates/davinci-coding-agent/design-ui test
      - run: npm --prefix crates/davinci-coding-agent/design-ui run build
      - name: Shipped UI matches the deterministic build
        run: git diff --exit-code -- crates/davinci-coding-agent/design-resources/ui
      - name: Browser confinement, transport and host policy fixtures
        run: node --test crates/davinci-coding-agent/src/interaction_testing/browser_backend.test.cjs crates/davinci-coding-agent/src/interaction_testing/browser_network.test.cjs crates/davinci-coding-agent/src/interaction_testing/browser_transport.test.cjs crates/davinci-coding-agent/src/interaction_testing/browser_host.test.cjs
      - name: Install explicit CI browser fixture
        working-directory: crates/davinci-coding-agent/design-ui
        run: npx --no-install playwright install --with-deps chromium
      - name: Real companion browser with recorded Rust dispatcher
        run: npm --prefix crates/davinci-coding-agent/design-ui run test:e2e
      - name: Preserve companion browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-companion-${{ runner.os }}
          path: crates/davinci-coding-agent/design-ui/test-results
          if-no-files-found: warn

  native-render:
    if: github.event_name == 'pull_request' || inputs.native_render
    # The namespace fixture needs a host that permits unprivileged bwrap setup.
    # Ubuntu 24.04 requires an administrator-provided AppArmor profile; do not
    # disable its host protections or relax the application's sandbox policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PI_OFFLINE: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: rustup show
      - name: Select isolated runtime and evidence directories
        shell: bash
        run: |
          echo "DAVINCI_DESIGN_RUNTIME=$RUNNER_TEMP/design-runtime" >> "$GITHUB_ENV"
          echo "DAVINCI_DESIGN_EVIDENCE=$RUNNER_TEMP/design-native-evidence" >> "$GITHUB_ENV"
      - name: Install explicit CI confinement and compiler fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --unshare-user-try --unshare-pid --unshare-net --ro-bind / / -- /usr/bin/true
          npm --prefix crates/davinci-coding-agent/design-ui ci
          npm --prefix crates/davinci-coding-agent/design-ui run build
      - name: Install explicit CI Chromium fixture
        working-directory: crates/davinci-coding-agent/design-ui
        run: npx --no-install playwright install --with-deps chromium
      - name: Pin the native runtime outside the workspace
        id: runtime
        run: |
          node crates/davinci-coding-agent/design-ui/scripts/install-runtime.cjs "$DAVINCI_DESIGN_RUNTIME"
          echo "DAVINCI_DESIGN_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - name: Strict real compiler, host, confined capture and prototype actions
        shell: bash
        env:
          DAVINCI_BROWSER_DIAGNOSTICS: '1'
        run: |
          mkdir -p "$DAVINCI_DESIGN_EVIDENCE"
          set -o pipefail
          cargo test -p davinci-coding-agent --locked --test design_runtime -- --ignored --nocapture --test-threads=1 2>&1 | tee "$DAVINCI_DESIGN_EVIDENCE/native-tests.log"
      - name: Preserve native gate diagnostics and successful capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-native-linux
          path: ${{ env.DAVINCI_DESIGN_EVIDENCE }}
          if-no-files-found: warn
      - name: Actual managed target handoff and retained screenshot
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: cargo test -p davinci-coding-agent --locked --test design_handoff native_target_flow -- --ignored --nocapture
      - name: Preserve target handoff receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-target-linux
          path: |
            ${{ env.DAVINCI_DESIGN_EVIDENCE }}/target-handoff.json
            ${{ env.DAVINCI_DESIGN_EVIDENCE }}/target-handoff.png
          if-no-files-found: warn
