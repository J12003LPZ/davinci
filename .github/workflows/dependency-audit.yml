name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    # New advisories land without any commit here; check weekly as well.
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned cargo-deny
        # cargo-deny needs a newer compiler than the repository's pinned 1.88.
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-deny --version 0.20.2 --locked
      - name: Advisories and sources
        run: cargo deny check advisories sources
