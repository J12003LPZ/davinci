name: Security SARIF interoperability
on:
  push:
  pull_request:
concurrency:
  group: security-sarif-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      PI_OFFLINE: "1"
      DAVINCI_OFFLINE: "1"
      DAVINCI_SARIF_PYTHON: python
      # Bypass rust-toolchain component auto-recovery in this Cargo-only job.
      # The SARIF schema test does not require clippy or rustfmt.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Provision test validator
        run: python -m pip install -r scripts/security-sarif-requirements.txt
      - name: Use repository-pinned Rust
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Validate native exports against official schema offline
        run: cargo test -p davinci-coding-agent --lib security_sarif_official_schema --locked -- --ignored
