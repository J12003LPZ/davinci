name: Harness optimization executor

on:
  push:
    branches:
      - feat/davinci-harness-optimization-20260914

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[opt-exec]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Add regression tests
        shell: bash
        run: |
          set -euo pipefail
          stage="$(cat .harness-opt-stage)"
          case "$stage" in
            governor) python3 .github/scripts/harness_optimization_apply.py --tests ;;
            context) python3 .github/scripts/harness_opt_context.py --tests ;;
            verification) python3 .github/scripts/harness_opt_verification.py --tests ;;
            recovery) python3 .github/scripts/harness_opt_recovery.py --tests ;;
            capability) python3 .github/scripts/harness_opt_capability.py --tests ;;
            phase1|phase2) : ;;
            *) echo "unknown stage: $stage" >&2; exit 2 ;;
          esac

      - name: Verify regression is red
        shell: bash
        run: |
          set -euo pipefail
          stage="$(cat .harness-opt-stage)"
          if [[ "$stage" == phase* ]]; then
            echo "Phase gate has no red step"
            exit 0
          fi
          case "$stage" in
            governor) test_cmd=(cargo test -p davinci-coding-agent large_error_output_is_reversibly_compressed) ;;
            context) test_cmd=(cargo test -p davinci-agent root_budget_shapes_provider_view_without_dropping_authority) ;;
            verification) test_cmd=(cargo test -p davinci-agent unrelated_successful_test_does_not_verify_mutation) ;;
            recovery) test_cmd=(cargo test -p davinci-agent tool_ledger_atomic_persist_replaces_complete_state) ;;
            capability) test_cmd=(cargo test -p davinci-coding-agent worker_context_query_is_node_specific_and_deterministic) ;;
            *) echo "unknown stage: $stage" >&2; exit 2 ;;
          esac
          if "${test_cmd[@]}"; then
            echo "Regression unexpectedly passed before implementation" >&2
            exit 1
          fi
          echo "Expected red regression confirmed for $stage"

      - name: Apply production implementation
        shell: bash
        run: |
          set -euo pipefail
          stage="$(cat .harness-opt-stage)"
          case "$stage" in
            governor)
              python3 .github/scripts/harness_optimization_apply.py --impl
              python3 .github/scripts/harness_optimization_fixup.py
              ;;
            context) python3 .github/scripts/harness_opt_context.py --impl ;;
            verification)
              python3 .github/scripts/harness_opt_verification.py --impl
              python3 .github/scripts/harness_opt_verification_fixup.py
              ;;
            recovery) python3 .github/scripts/harness_opt_recovery.py --impl ;;
            capability) python3 .github/scripts/harness_opt_capability.py --impl ;;
            phase1) python3 .github/scripts/harness_opt_phase1_fixup.py ;;
            phase2) : ;;
            *) echo "unknown stage: $stage" >&2; exit 2 ;;
          esac

      - name: Format
        run: cargo fmt --all

      - name: Run stage verification
        shell: bash
        run: |
          set -euo pipefail
          stage="$(cat .harness-opt-stage)"
          case "$stage" in
            governor)
              cargo test -p davinci-coding-agent large_error_output_is_reversibly_compressed
              cargo test -p davinci-coding-agent content_router_classifies_extended_shapes
              cargo test -p davinci-coding-agent specialized_view_must_clear_minimum_reduction_threshold
              cargo test -p davinci-coding-agent governor_tracks_retrievals_by_content_kind
              cargo test -p davinci-coding-agent content_router_classifies_and_reduces_supported_shapes
              cargo test -p davinci-coding-agent compression_preserves_notable_lines_and_is_reversible
              cargo clippy -p davinci-coding-agent --all-targets -- -D warnings
              ;;
            context)
              cargo test -p davinci-agent root_budget_shapes_provider_view_without_dropping_authority
              cargo test -p davinci-agent scoped_context_files_follow_target_ancestors
              cargo test -p davinci-agent context::
              cargo clippy -p davinci-agent --all-targets -- -D warnings
              ;;
            verification)
              cargo test -p davinci-agent unrelated_successful_test_does_not_verify_mutation
              cargo test -p davinci-agent mutation_then_successful_verification_is_verified
              cargo test -p davinci-agent later_mutation_invalidates_previous_verification
              cargo test -p davinci-agent read_only_turn_does_not_require_verification
              cargo clippy -p davinci-agent --all-targets -- -D warnings
              ;;
            recovery)
              cargo test -p davinci-agent tool_ledger_atomic_persist_replaces_complete_state
              cargo test -p davinci-agent corrupt_tool_ledger_fails_closed
              cargo test -p davinci-agent tool_ledger_uses_runtime_capability_side_effect
              cargo test -p davinci-agent restart_restores_uncertain_mutation_and_blocks_replay
              cargo clippy -p davinci-agent --all-targets -- -D warnings
              ;;
            capability)
              cargo test -p davinci-coding-agent worker_context_query_is_node_specific_and_deterministic
              cargo test -p davinci-coding-agent context_utility_prefers_verified_relevant_value_per_token
              cargo test -p davinci-coding-agent capability_selection_preserves_tools_and_context_budget
              cargo test -p davinci-coding-agent ecosystem::context::
              cargo clippy -p davinci-coding-agent --all-targets -- -D warnings
              ;;
            phase1)
              cargo test -p davinci-agent context::
              cargo test -p davinci-agent verification
              cargo test -p davinci-agent tool_ledger
              cargo test -p davinci-coding-agent token_governor
              cargo test -p davinci-coding-agent content_router
              cargo clippy -p davinci-agent --all-targets -- -D warnings
              cargo clippy -p davinci-coding-agent --all-targets -- -D warnings
              ;;
            phase2)
              cargo test -p davinci-coding-agent ecosystem::
              cargo test -p davinci-coding-agent learning::
              cargo test -p davinci-coding-agent vector_memory
              cargo clippy -p davinci-coding-agent --all-targets -- -D warnings
              ;;
            *) echo "unknown stage: $stage" >&2; exit 2 ;;
          esac
          git diff --check

      - name: Commit verified production changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage="$(cat .harness-opt-stage)"
          case "$stage" in
            governor) message="feat(governor): improve reversible content routing" ;;
            context) message="feat(context): enforce bounded scoped root context" ;;
            verification) message="feat(verification): require mutation-scope coverage" ;;
            recovery) message="fix(recovery): harden durable tool attempt metadata" ;;
            capability) message="feat(capability): make graph context selection node-aware" ;;
            phase1) message="test(governor): align structured test-output expectation" ;;
            phase2) echo "Phase gate produced changes unexpectedly" >&2; exit 1 ;;
          esac
          git add crates .harness-opt-stage
          git commit -m "$message"
          git push origin "HEAD:${GITHUB_REF_NAME}"
