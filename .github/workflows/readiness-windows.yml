name: Readiness Windows evidence

on:
  pull_request:
    paths:
      - '.github/workflows/readiness-windows.yml'
      - 'crates/davinci-agent/src/jobs/supervisor/**'
      - 'crates/davinci-coding-agent/src/native_extensions/graph/coordinator_handler.rs'
  push:
    branches: [codex/production-readiness-cloud-20260930]
    paths: ['.github/workflows/readiness-windows.yml']

permissions:
  contents: read

jobs:
  full-parallel-library:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DAVINCI_OFFLINE: '1'
      PI_OFFLINE: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build pinned toolchain and full library test binary
        shell: pwsh
        run: |
          rustup show
          node --version
          cargo build -p davinci-coding-agent --bin davinci --features test-fixtures --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p davinci-coding-agent --lib --locked --no-run
          exit $LASTEXITCODE
      - name: Capture two full parallel suite runs and relative Node process state
        shell: pwsh
        run: |
          $samples = Join-Path $env:RUNNER_TEMP 'relative-node-processes.jsonl'
          $monitor = Start-Job -ArgumentList $samples -ScriptBlock {
            param($path)
            while ($true) {
              $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue)
              $cpu = Get-CimInstance Win32_PerfFormattedData_PerfOS_Processor -Filter "Name='_Total'" -ErrorAction SilentlyContinue
              foreach ($node in $nodes) {
                if ($node.CommandLine -notmatch 'relative.cjs') { continue }
                [ordered]@{
                  at = [DateTime]::UtcNow.ToString('o')
                  pid = $node.ProcessId
                  parent = $node.ParentProcessId
                  command = $node.CommandLine
                  user_time = $node.UserModeTime
                  kernel_time = $node.KernelModeTime
                  node_count = $nodes.Count
                  total_cpu = $cpu.PercentProcessorTime
                } | ConvertTo-Json -Compress | Add-Content -Path $path
              }
              Start-Sleep -Seconds 1
            }
          }
          $failed = $false
          try {
            foreach ($attempt in 1,2) {
              cargo test -p davinci-coding-agent --lib --locked 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "windows-library-$attempt.log")
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          } finally {
            Stop-Job $monitor
            Receive-Job $monitor
            Remove-Job $monitor
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-windows-parallel
          path: |
            ${{ runner.temp }}/windows-library-*.log
            ${{ runner.temp }}/relative-node-processes.jsonl
          if-no-files-found: warn
