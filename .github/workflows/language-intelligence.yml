name: Language intelligence

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/davinci-coding-agent/Cargo.toml"
      - "crates/davinci-coding-agent/src/native_extensions/language_intelligence/**"
      - "crates/davinci-coding-agent/src/semantic/**"
      - "crates/davinci-coding-agent/src/sdk.rs"
      - "crates/davinci-agent/src/semantic.rs"
      - "crates/davinci-agent/src/runtime/capabilities.rs"
      - "crates/davinci-agent/src/lib.rs"
      - ".github/workflows/language-intelligence.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/davinci-coding-agent/Cargo.toml"
      - "crates/davinci-coding-agent/src/native_extensions/language_intelligence/**"
      - "crates/davinci-coding-agent/src/semantic/**"
      - "crates/davinci-coding-agent/src/sdk.rs"
      - "crates/davinci-agent/src/semantic.rs"
      - "crates/davinci-agent/src/runtime/capabilities.rs"
      - "crates/davinci-agent/src/lib.rs"
      - ".github/workflows/language-intelligence.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PI_OFFLINE: "1"

jobs:
  deterministic:
    name: deterministic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Record absolute Node fixture path
        shell: bash
        run: echo "DAVINCI_TEST_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - name: Deterministic language-intelligence suite
        run: cargo test -p davinci-coding-agent --locked --lib language_intelligence
      - name: Surface parity and worktree isolation
        run: cargo test -p davinci-coding-agent --locked --test lsp_surface_parity --test lsp_graph_isolation
      - name: Transaction freshness
        run: cargo test -p davinci-coding-agent --locked --test transaction_intelligence
      - name: Semantic core contracts
        run: cargo test -p davinci-agent --locked semantic_tools_registration_and_fallback_execution

  live:
    name: live servers (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use repository-pinned Rust and rust-src
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          rustup component add rust-src --toolchain 1.83.0
      - name: Provision pinned Rust and Python language servers
        shell: bash
        env:
          RA_TAG: "2026-09-21"
          RA_LINUX_SHA256: "b2d24ce2bda2ea05b1ad7c2917d205f8111775f703ccd908e6061803ae8257d0"
          RA_MAC_X64_SHA256: "1e2f706ee97d9f931ea36ed4e83f839efd0ac09870e18ec8350877d7b98ad8a0"
          RA_MAC_ARM64_SHA256: "eb474adfd12b6e66a6d0a7c25ed51210a64a0237f326f898e32e25164c9b11ad"
          RA_WINDOWS_SHA256: "f62a18aad35568fd9205006a62f97613eac8c4f2ec5fe43c830dde09684e5e6f"
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/davinci-lsp-live"
          mkdir -p "$prefix"
          python - "$prefix" "$RUNNER_OS" "$RUNNER_ARCH" "$RA_TAG" "$RA_LINUX_SHA256" "$RA_MAC_X64_SHA256" "$RA_MAC_ARM64_SHA256" "$RA_WINDOWS_SHA256" <<'PY'
          import gzip, hashlib, pathlib, stat, sys, urllib.request, zipfile
          root = pathlib.Path(sys.argv[1])
          runner, arch, tag = sys.argv[2], sys.argv[3], sys.argv[4]
          expected = {
              ("Linux", "X64"): sys.argv[5],
              ("macOS", "X64"): sys.argv[6],
              ("macOS", "ARM64"): sys.argv[7],
              ("Windows", "X64"): sys.argv[8],
          }[(runner, arch)]
          asset = {
              ("Linux", "X64"): "rust-analyzer-x86_64-unknown-linux-gnu.gz",
              ("macOS", "X64"): "rust-analyzer-x86_64-apple-darwin.gz",
              ("macOS", "ARM64"): "rust-analyzer-aarch64-apple-darwin.gz",
              ("Windows", "X64"): "rust-analyzer-x86_64-pc-windows-msvc.zip",
          }[(runner, arch)]
          archive = root / asset
          url = f"https://github.com/rust-lang/rust-analyzer/releases/download/{tag}/{asset}"
          urllib.request.urlretrieve(url, archive)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == expected, (digest, expected)
          if runner == "Windows":
              with zipfile.ZipFile(archive) as z:
                  z.extractall(root / "ra")
              matches = list((root / "ra").rglob("rust-analyzer.exe"))
              assert len(matches) == 1, matches
              executable = matches[0]
          else:
              executable = root / "rust-analyzer"
              with gzip.open(archive, "rb") as src:
                  executable.write_bytes(src.read())
              executable.chmod(executable.stat().st_mode | stat.S_IXUSR)
          (root / "rust-analyzer-path.txt").write_text(str(executable.resolve()))
          PY
          python -m venv "$prefix/basedpyright"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$prefix/basedpyright/Scripts/python.exe" -m pip install --disable-pip-version-check basedpyright==1.40.1
            basedpyright_path="$(cygpath -w "$prefix/basedpyright/Scripts/basedpyright-langserver.exe")"
          else
            "$prefix/basedpyright/bin/python" -m pip install --disable-pip-version-check basedpyright==1.40.1
            basedpyright_path="$prefix/basedpyright/bin/basedpyright-langserver"
          fi
          npm install --prefix "$prefix/pyright" --no-save --no-package-lock pyright@1.1.414
          npm install --prefix "$prefix/typescript" --no-save --no-package-lock typescript@5.9.3 typescript-language-server@5.3.0
          pyright_server="$prefix/pyright/node_modules/pyright/langserver.index.js"
          pyright_cli="$prefix/pyright/node_modules/pyright/index.js"
          typescript_path="$prefix/typescript/node_modules/typescript"
          tls_path="$prefix/typescript/node_modules/typescript-language-server"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pyright_server="$(cygpath -w "$pyright_server")"
            pyright_cli="$(cygpath -w "$pyright_cli")"
            typescript_path="$(cygpath -w "$typescript_path")"
            tls_path="$(cygpath -w "$tls_path")"
          fi
          sysroot="$(rustc --print sysroot)"
          {
            echo "DAVINCI_TEST_BASEDPYRIGHT=$basedpyright_path"
            echo "DAVINCI_TEST_PYRIGHT=$pyright_server"
            echo "DAVINCI_TEST_PYRIGHT_CLI=$pyright_cli"
            echo "DAVINCI_TEST_TYPESCRIPT=$typescript_path"
            echo "DAVINCI_TEST_LANGUAGE_SERVER=$tls_path"
            echo "DAVINCI_TEST_RUST_ANALYZER=$(cat "$prefix/rust-analyzer-path.txt")"
            echo "DAVINCI_TEST_PYTHON=$(python -c 'import sys; print(sys.executable)')"
            echo "DAVINCI_TEST_RUST_SYSROOT=$sysroot"
            echo "DAVINCI_TEST_RUST_SRC=$sysroot/lib/rustlib/src/rust/library"
          } >> "$GITHUB_ENV"
      - name: Record provisioned versions
        shell: bash
        run: |
          set -euo pipefail
          "$DAVINCI_TEST_RUST_ANALYZER" --version
          "$DAVINCI_TEST_PYTHON" --version
          node "$DAVINCI_TEST_PYRIGHT_CLI" --version
          "$DAVINCI_TEST_BASEDPYRIGHT" --version
      - name: Real TypeScript semantics
        run: cargo test -p davinci-coding-agent --locked --lib real_typescript_semantics_and_edit_synchronization -- --ignored --nocapture
      - name: Real rust-analyzer semantics
        run: cargo test -p davinci-coding-agent --locked --lib real_rust_lsp_semantics -- --ignored --nocapture
      - name: Real BasedPyright project interpreter trust boundary
        run: cargo test -p davinci-coding-agent --locked --lib real_python_project_venv_executes_only_after_trusted_launch -- --ignored --nocapture
      - name: Real BasedPyright semantics
        run: cargo test -p davinci-coding-agent --locked --lib real_basedpyright_lsp_semantics -- --ignored --nocapture
      - name: Real Pyright semantics
        run: cargo test -p davinci-coding-agent --locked --lib real_pyright_lsp_semantics -- --ignored --nocapture
      - name: Build production CLI for workflow evaluation
        run: cargo build -p davinci-coding-agent --locked --bin davinci
      - name: Real CLI language-intelligence evaluation
        shell: bash
        run: python scripts/eval-native-intelligence.py "target/debug/davinci${{ runner.os == 'Windows' && '.exe' || '' }}" --lsp
      - name: Measure startup and polyglot scenarios
        shell: bash
        run: |
          set -euo pipefail
          binary="target/debug/davinci${{ runner.os == 'Windows' && '.exe' || '' }}"
          python scripts/lsp-benchmark.py --binary "$binary" --scenario startup --repetitions 20 --output "$RUNNER_TEMP/lsp-startup.json"
          python scripts/lsp-benchmark.py --binary "$binary" --scenario polyglot --repetitions 20 --output "$RUNNER_TEMP/lsp-polyglot.json"
      - name: Preserve language-intelligence measurements
        uses: actions/upload-artifact@v4
        with:
          name: language-intelligence-${{ runner.os }}
          path: |
            ${{ runner.temp }}/lsp-startup.json
            ${{ runner.temp }}/lsp-polyglot.json
          if-no-files-found: error
