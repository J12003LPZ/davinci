name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PI_OFFLINE: "1"

jobs:
  reliability-followup:
    if: >-
      github.ref == 'refs/heads/fix/luna-reliability-followups-20260914' &&
      github.event.head_commit.message == 'run reliability followup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Confirm regression tests are red
        shell: bash
        run: |
          set +e
          cargo test -p davinci-agent --test luna_reliability_followups
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected follow-up regression tests to fail before the patch.'
            exit 1
          fi
      - name: Confirm Linux path regressions are red
        shell: bash
        run: |
          set +e
          cargo test -p davinci-agent f05_normalize_relative_path_safety
          a=$?
          cargo test -p davinci-agent windows_drive_and_unc_path_containment
          b=$?
          set -e
          if [ "$a" -eq 0 ] || [ "$b" -eq 0 ]; then
            echo 'Expected both path regressions to reproduce before the patch.'
            exit 1
          fi
      - name: Apply focused fixes
        run: |
          python scripts/apply_luna_reliability_followups.py
          sed -i 's/use std::path::{Component, Path, PathBuf};/use std::path::{Path, PathBuf};/' crates/davinci-agent/src/permission.rs
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/davinci-agent/src/runtime/capabilities.rs')
          text = p.read_text()
          text = text.replace('''                "read",
                ConcurrencyPolicy::ParallelSafe,
                ReplayPolicy::SafeToReplay,
                OutputPolicy::Compressible,
''', '''                "read",
                ConcurrencyPolicy::ParallelSafe,
                ReplayPolicy::SafeToReplay,
                OutputPolicy::LosslessRequired,
''', 1)
          text = text.replace('''                "edit",
                ConcurrencyPolicy::SerialBarrier,
                ReplayPolicy::ReconcileBeforeReplay,
                OutputPolicy::Normal,
''', '''                "edit",
                ConcurrencyPolicy::SerialBarrier,
                ReplayPolicy::ReconcileBeforeReplay,
                OutputPolicy::LosslessRequired,
''', 1)
          text = text.replace('''                "exec_command",
                ConcurrencyPolicy::SerialBarrier,
                ReplayPolicy::NeverAutoReplay,
                OutputPolicy::LosslessRequired,
''', '''                "exec_command",
                ConcurrencyPolicy::SerialBarrier,
                ReplayPolicy::NeverAutoReplay,
                OutputPolicy::Compressible,
''', 1)
          text = text.replace('''                "agent",
                ConcurrencyPolicy::ParallelSafe,
                ReplayPolicy::NeverAutoReplay,
                OutputPolicy::Normal,
''', '''                "agent",
                ConcurrencyPolicy::ParallelSafe,
                ReplayPolicy::NeverAutoReplay,
                OutputPolicy::LosslessRequired,
''', 1)
          p.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Targeted regression tests
        run: |
          cargo test -p davinci-agent --test luna_reliability_followups
          cargo test -p davinci-agent f05_normalize_relative_path_safety
          cargo test -p davinci-agent f05_same_file_via_alias
          cargo test -p davinci-agent windows_drive_and_unc_path_containment
          cargo test -p davinci-agent representative_tools_have_consistent_execution_metadata
      - name: Focused lint
        run: |
          cargo clippy -p davinci-agent --all-targets -- -D warnings
          cargo clippy -p davinci-coding-agent --all-targets -- -D warnings
      - name: Workspace verification
        run: cargo test --workspace
      - name: Remove one-shot patch machinery
        run: |
          git checkout b2562436c4b789baab0dd7489f58510356c76a5f -- .github/workflows/ci.yml
          git rm scripts/apply_luna_reliability_followups.py
      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(agent): close reliability follow-up gaps'
          git push origin HEAD:fix/luna-reliability-followups-20260914

  voice-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux capture headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Native deterministic tests (no microphone or model)
        run: cargo test -p davinci-voice --features native --locked
      - name: Build matching helper
        run: cargo build -p davinci-voice --features native --bin davinci-voice-worker --locked

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Prompt and behavioral contracts
        run: |
          cargo test -p davinci-agent prompt::
          cargo test -p davinci-evals behavior::
      - name: Ecosystem integration
        run: cargo test -p davinci-coding-agent ecosystem_loop_ -- --nocapture
      - name: Ecosystem invariants
        run: cargo test -p davinci-coding-agent ecosystem_invariants_ -- --nocapture
      - name: Runtime migration baseline
        run: cargo test -p davinci-coding-agent runtime_migration_preserves_ecosystem_baseline -- --nocapture
      - name: Workspace tests
        run: cargo test --workspace
