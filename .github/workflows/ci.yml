name: CI Debug Linux Workspace Tests

on:
  push:

env:
  CARGO_TERM_COLOR: always
  PI_OFFLINE: 1

jobs:
  diagnose-workspace-tests:
    if: github.ref == 'refs/heads/ci-debug-linux-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Workspace tests with failure annotation
        run: python scripts/ci-debug-workspace-tests.py
