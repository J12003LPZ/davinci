name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PI_OFFLINE: "1"

jobs:
  voice-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux capture headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Native deterministic tests (no microphone or model)
        run: cargo test -p davinci-voice --features native --locked
      - name: Build matching helper
        run: cargo build -p davinci-voice --features native --bin davinci-voice-worker --locked

  quality:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Prompt contracts
        run: |
          cargo test -p davinci-agent prompt::
      - name: Behavioral contracts
        run: |
          cargo test -p davinci-evals behavior::
      - name: Ecosystem integration
        run: cargo test -p davinci-coding-agent ecosystem_loop_ -- --nocapture
      - name: Ecosystem invariants
        run: cargo test -p davinci-coding-agent ecosystem_invariants_ -- --nocapture
      - name: Runtime migration baseline
        run: cargo test -p davinci-coding-agent runtime_migration_preserves_ecosystem_baseline -- --nocapture
      - name: Workspace tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cargo build -p davinci-coding-agent --bin davinci
          cargo test --workspace
