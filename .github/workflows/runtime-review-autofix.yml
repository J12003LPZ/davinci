name: Temporary runtime review formatter

on:
  push:
    branches:
      - codex/runtime-hardening-review-20260923

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/runtime-hardening-review-20260923
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Format workspace
        run: cargo fmt --all
      - name: Remove one-shot workflow
        run: rm .github/workflows/runtime-review-autofix.yml
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format runtime review fixes"
          git push origin HEAD:codex/runtime-hardening-review-20260923
