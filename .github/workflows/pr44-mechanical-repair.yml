name: PR44 mechanical repair

on:
  push:
    branches:
      - codex/2026-09-24-pr44-review-fixes

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use repository-pinned Rust
        run: rustup show
      - name: Regenerate lockfile and format workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          rm .github/workflows/pr44-mechanical-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate lockfile and format workspace"
          git push origin HEAD:codex/2026-09-24-pr44-review-fixes
