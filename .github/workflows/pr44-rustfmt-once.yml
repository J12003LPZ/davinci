name: PR44 one-shot rustfmt

on:
  push:
    branches:
      - codex/2026-09-24-pr44-repair
    paths:
      - .github/workflows/pr44-rustfmt-once.yml

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/2026-09-24-pr44-repair
          fetch-depth: 0
      - name: Use repository-pinned Rust
        run: |
          rustup toolchain install 1.83.0 --profile minimal --component rustfmt
          rustup override set 1.83.0
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: apply repository-wide rustfmt"
          git push origin HEAD:codex/2026-09-24-pr44-repair
