name: Graph verification repair

on:
  push:
    branches: [J12003LPZ/graph-resume-fix-20260921]
    paths:
      - 'crates/davinci-agent/src/shell_policy.rs'
      - 'crates/davinci-coding-agent/src/native_extensions/graph/**'
      - '.github/workflows/graph-verification.yml'
      - '.github/patches/graph-*.patch'

permissions:
  contents: read

concurrency:
  group: graph-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_OFFLINE: '1'
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: graph-verification
          cache-on-failure: true
      - name: Apply exact locally tested source
        if: contains(github.event.head_commit.message, '[graph-verify-apply]')
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess
          patches = {
              'graph-verification.patch': 'd476e9d4164faaf45a343e83afdd2a4ff66989ced80cfebf28a9832e5e2411a5',
              'graph-native-diagnostics.patch': 'a74aa327b287c013a84234b585da65c488612bf02b8b1abee198a40f3a1d1c18',
          }
          for name, digest in patches.items():
              patch = pathlib.Path('.github/patches') / name
              assert hashlib.sha256(patch.read_bytes()).hexdigest() == digest
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
          PY
      - name: Formatting and whitespace
        run: |
          cargo fmt --all -- --check
          git diff --check
          node --version
      - name: Entire graph regression suite
        run: |
          mkdir -p "$RUNNER_TEMP/graph-evidence"
          cargo test --locked -p davinci-coding-agent --lib native_extensions::graph:: 2>&1 | tee "$RUNNER_TEMP/graph-evidence/graph.log"
      - name: Central shell-policy regressions
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/graph-evidence"
          cargo test --locked -p davinci-agent --lib shell_policy:: 2>&1 | tee "$RUNNER_TEMP/graph-evidence/shell-policy.log"
      - name: Host library and tests lint
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/graph-evidence"
          cargo clippy --locked -p davinci-coding-agent --lib --tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/graph-evidence/clippy.log"
      - name: Bind evidence to tested source
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          paths = ['crates/davinci-agent/src/shell_policy.rs', 'crates/davinci-coding-agent/src/native_extensions/graph/verify.rs', 'crates/davinci-coding-agent/src/native_extensions/graph/coordinator_handler.rs']
          receipt = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'graph-evidence'
          out.mkdir(exist_ok=True)
          (out / 'source.json').write_text(json.dumps(receipt, sort_keys=True))
          (out / 'commit.txt').write_text(os.environ['GITHUB_SHA'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-verification-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/graph-evidence
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: regression
    if: success() && contains(github.event.head_commit.message, '[graph-verify-apply]') && github.ref == 'refs/heads/J12003LPZ/graph-resume-fix-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: graph-verification-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-evidence
      - name: Publish only the source tested on both platforms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          patches = {
              'graph-verification.patch': 'd476e9d4164faaf45a343e83afdd2a4ff66989ced80cfebf28a9832e5e2411a5',
              'graph-native-diagnostics.patch': 'a74aa327b287c013a84234b585da65c488612bf02b8b1abee198a40f3a1d1c18',
          }
          for name, digest in patches.items():
              patch = pathlib.Path('.github/patches') / name
              assert hashlib.sha256(patch.read_bytes()).hexdigest() == digest
              subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          receipts = list((pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-evidence').glob('*/source.json'))
          assert len(receipts) == 2, 'both platform receipts required'
          paths = ['crates/davinci-agent/src/shell_policy.rs', 'crates/davinci-coding-agent/src/native_extensions/graph/verify.rs', 'crates/davinci-coding-agent/src/native_extensions/graph/coordinator_handler.rs']
          actual = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          for receipt in receipts:
              assert json.loads(receipt.read_text()) == actual, 'tested source mismatch'
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          assert set(changed) == set(paths), 'unexpected source change'
          PY
          expected=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$expected" = "$GITHUB_SHA"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(graph): normalize Cargo formatting checks without broadening shell authority'
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
