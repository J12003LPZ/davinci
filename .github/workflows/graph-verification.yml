name: Graph verification repair

on:
  push:
    branches: [J12003LPZ/graph-resume-fix-20260921, J12003LPZ/claude-parity-graph-completion]
    paths:
      - 'crates/davinci-agent/src/shell_policy.rs'
      - 'crates/davinci-coding-agent/src/native_extensions/graph/**'
      - '.github/workflows/graph-verification.yml'
      - '.github/patches/graph-*.patch'

permissions:
  contents: read

concurrency:
  group: graph-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_OFFLINE: '1'
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: graph-verification
          cache-on-failure: true
      - name: Formatting and whitespace
        run: |
          cargo fmt --all -- --check
          git diff --exit-code
          node --version
      - name: Entire graph regression suite
        run: |
          mkdir -p "$RUNNER_TEMP/graph-evidence"
          cargo test --locked -p davinci-coding-agent --lib native_extensions::graph:: 2>&1 | tee "$RUNNER_TEMP/graph-evidence/graph.log"
      - name: Central shell-policy regressions
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/graph-evidence"
          cargo test --locked -p davinci-agent --lib shell_policy:: 2>&1 | tee "$RUNNER_TEMP/graph-evidence/shell-policy.log"
      - name: Host library and tests lint
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/graph-evidence"
          cargo clippy --locked -p davinci-coding-agent --lib --tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/graph-evidence/clippy.log"
      - name: Bind evidence to tested source
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          paths = ['crates/davinci-agent/src/shell_policy.rs', 'crates/davinci-coding-agent/src/native_extensions/graph/verify.rs', 'crates/davinci-coding-agent/src/native_extensions/graph/coordinator_handler.rs']
          receipt = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'graph-evidence'
          out.mkdir(exist_ok=True)
          (out / 'source.json').write_text(json.dumps(receipt, sort_keys=True))
          (out / 'commit.txt').write_text(os.environ['GITHUB_SHA'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-verification-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/graph-evidence
          retention-days: 7
          if-no-files-found: warn
