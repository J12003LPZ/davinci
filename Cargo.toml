[workspace]
resolver = "2"
members = [
    "crates/pi-telemetry",
    "crates/pi-protocol",
    "crates/pi-session",
    "crates/pi-session-sqlite",
    "crates/pi-ai",
    "crates/pi-agent",
    "crates/pi-tui",
    "crates/pi-client",
    "crates/pi-server",
    "crates/pi-evals",
    "crates/pi-coding-agent",
    "crates/pi-parity",
]

[workspace.package]
version = "0.84.4"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["Pi Rust port"]
repository = "https://github.com/earendil-works/pi"

[workspace.dependencies]
pi-telemetry = { path = "crates/pi-telemetry" }
pi-protocol = { path = "crates/pi-protocol" }
pi-session = { path = "crates/pi-session" }
pi-session-sqlite = { path = "crates/pi-session-sqlite" }
pi-ai = { path = "crates/pi-ai" }
pi-agent = { path = "crates/pi-agent" }
pi-tui = { path = "crates/pi-tui" }
pi-client = { path = "crates/pi-client" }
pi-server = { path = "crates/pi-server" }
pi-evals = { path = "crates/pi-evals" }
pi-parity = { path = "crates/pi-parity" }

clap = "=4.5.23"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
tempfile = "=3.14.0"
thiserror = "1"
ureq = { version = "=2.10.1", default-features = false, features = ["json", "tls"] }
url = "=2.5.0"
rustls = { version = "=0.23.19", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "=1.10.1"
webpki-roots = "=0.26.7"
zeroize = "=1.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "=2.7.1", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
unicode-width = "0.2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
glob = "0.3"
walkdir = "2"
regex = "1"
similar = "2"
pulldown-cmark = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
ctrlc = "3"

[profile.release]
lto = "thin"
codegen-units = 1
