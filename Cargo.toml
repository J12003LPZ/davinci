[workspace]
resolver = "2"
members = [
    "crates/davinci-protocol",
    "crates/davinci-mcp",
    "crates/davinci-session",
    "crates/davinci-session-sqlite",
    "crates/davinci-ai",
    "crates/davinci-agent",
    "crates/davinci-tui",
    "crates/davinci-client",
    "crates/davinci-server",
    "crates/davinci-telemetry",
    "crates/davinci-evals",
    "crates/davinci-coding-agent",
    "crates/davinci-parity",
]

[workspace.package]
# The product version. It moved past the TypeScript parity pin (pi 0.84.4,
# vendor commit 853a80d2) when the davinci UI landed; the identity presented
# to providers and to JavaScript extensions still reports 0.84.4, because that
# is a wire contract rather than a release number.
version = "0.85.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/J12003LPZ/davinci"
rust-version = "1.83"

[workspace.dependencies]
base64 = "=0.22.1"
crossterm = "=0.28.1"
dirs = "=5.0.1"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm", "underline-color"] }
percent-encoding = "=2.3.1"
pulldown-cmark = { version = "=0.12.2", default-features = false }
regex = "=1.11.1"
fancy-regex = "=0.14.0"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "gif", "webp", "bmp", "png"] }
libc = "=0.2.189"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.216", features = ["derive", "rc"] }
serde_json = "=1.0.134"
similar = "=2.6.0"
icu_segmenter = { version = "=1.5.0", default-features = false, features = ["compiled_data"] }
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.0"
walkdir = "=2.5.0"
sha1 = "=0.10.6"
sha2 = "=0.10.8"
clap = { version = "=4.5.23", features = ["derive"] }
uuid = { version = "=1.11.0", features = ["v4", "v7", "serde"] }
tempfile = "=3.14.0"
thiserror = "=1.0.69"
ureq = { version = "=2.10.1", default-features = false, features = ["json", "tls"] }
url = "=2.5.0"
rustls = { version = "=0.23.19", default-features = false, features = ["std", "tls12", "ring", "logging"] }
rustls-pki-types = "=1.10.1"
webpki-roots = "=0.26.7"
zeroize = { version = "=1.8.1", features = ["serde"] }
signal-hook = "=0.3.18"
zstd = "=0.13.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
