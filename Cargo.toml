[workspace]
resolver = "2"
members = [
    "crates/pi-ai",
    "crates/pi-agent",
    "crates/pi-tui",
    "crates/pi-session",
    "crates/pi-session-sqlite",
    "crates/pi-protocol",
    "crates/pi-client",
    "crates/pi-server",
    "crates/pi-telemetry",
    "crates/pi-evals",
    "crates/pi-coding-agent",
    "crates/pi-parity",
]

[workspace.dependencies]
clap = { version = "=4.5.23", features = ["derive", "env"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
tempfile = "=3.14.0"
thiserror = "=1.0.69"
ureq = { version = "=2.10.1", features = ["json", "tls"] }
url = "=2.5.0"
rustls = "=0.23.19"
rustls-pki-types = "=1.10.1"
webpki-roots = "=0.26.7"
zeroize = { version = "=1.8.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ciborium = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "vtab", "modern_sqlite"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
base64 = "0.22"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
async-trait = "0.1"
bytes = "1.9"
tokio-stream = "0.1"
schemars = { version = "0.8", features = ["chrono"] }
glob = "0.3"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
