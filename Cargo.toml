[workspace]
members = [
    "crates/pi-ai",
    "crates/pi-agent",
    "crates/pi-tui",
    "crates/pi-session",
    "crates/pi-session-sqlite",
    "crates/pi-protocol",
    "crates/pi-client",
    "crates/pi-server",
    "crates/pi-telemetry",
    "crates/pi-evals",
    "crates/pi-coding-agent",
    "crates/pi-parity",
]
resolver = "2"

[workspace.package]
version = "0.84.4"
edition = "2021"
rust-version = "1.83.0"
license = "MIT"
authors = ["Earendil Works"]

[workspace.dependencies]
clap = { version = "=4.5.23", features = ["derive", "env"] }
uuid = { version = "=1.11.0", features = ["v4", "v7", "serde"] }
tempfile = "=3.14.0"
thiserror = "=1.0.69"
ureq = { version = "=2.10.1", features = ["json", "tls"] }
url = "=2.5.0"
rustls = "=0.23.19"
rustls-pki-types = "=1.10.1"
webpki-roots = "=0.26.7"
zeroize = "=1.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
glob = "0.3"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
similar = "2.6"
colored = "2.1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
crossterm = "0.28"
unicode-width = "0.1"
