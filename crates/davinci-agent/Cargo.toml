[package]
name = "davinci-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agent runtime matching @earendil-works/pi-agent-core"

[dependencies]
davinci-ai = { path = "../davinci-ai" }
davinci-mcp = { path = "../davinci-mcp" }
davinci-protocol = { path = "../davinci-protocol" }
davinci-session = { path = "../davinci-session" }
davinci-sys = { path = "../davinci-sys" }
davinci-telemetry = { path = "../davinci-telemetry" }
base64.workspace = true
image.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
walkdir.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
davinci-mcp = { path = "../davinci-mcp", features = ["test-fixtures"] }
