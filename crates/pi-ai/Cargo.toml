[package]
name = "pi-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LLM stream contract and mock provider"

[dependencies]
pi-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# rustc 1.83: pin ureq 2.10 + url 2.5.0 + rustls 0.23.19 (newer url/idna/icu need 1.85+).
ureq = { version = "=2.10.1", default-features = false, features = ["json", "tls"] }
url = "=2.5.0"
rustls = { version = "=0.23.19", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "=0.26.7"
rustls-pki-types = "=1.10.1"
zeroize = "=1.8.1"
