[package]
name = "davinci-coding-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Coding agent CLI matching @earendil-works/pi-coding-agent"

[lib]
name = "davinci_coding_agent"
path = "src/lib.rs"

[[bin]]
name = "davinci"
path = "src/main.rs"

[dependencies]
davinci-voice = { path = "../davinci-voice" }
davinci-agent = { path = "../davinci-agent" }
davinci-ai = { path = "../davinci-ai" }
davinci-client = { path = "../davinci-client", optional = true }
davinci-mcp = { path = "../davinci-mcp" }
davinci-protocol = { path = "../davinci-protocol" }
davinci-server = { path = "../davinci-server", optional = true }
davinci-session = { path = "../davinci-session" }
davinci-sys = { path = "../davinci-sys" }
davinci-telemetry = { path = "../davinci-telemetry" }
davinci-tui = { path = "../davinci-tui" }
crossterm.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
ureq.workspace = true
url.workspace = true
image.workspace = true
libc.workspace = true
signal-hook.workspace = true
sha2.workspace = true
zeroize.workspace = true
walkdir.workspace = true
regex.workspace = true
tree-sitter.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
ignore.workspace = true
globset.workspace = true
notify.workspace = true

[dev-dependencies]
tempfile.workspace = true
davinci-ai = { path = "../davinci-ai", features = ["test-fixtures"] }
davinci-mcp = { path = "../davinci-mcp", features = ["test-fixtures"] }

[features]
default = []
experimental-ipc = ["dep:davinci-server", "dep:davinci-client"]
interaction-testing = []
test-fixtures = ["davinci-ai/test-fixtures", "davinci-mcp/test-fixtures"]
